networks:
  gw-net:
    external: true
    name: ${DOCKER_BRIDGE_NAME}

services:
  enclave:
     image: enclavenetworks/enclave:latest
     restart: unless-stopped
     volumes:
      - enclave-config:/etc/enclave
      - enclave-logs:/var/log/enclave
     mem_limit: 300M
     cpu_count: 2
     cap_add:
       - NET_ADMIN
     devices:
       - /dev/net/tun
     network_mode: 'service:pihole'
     healthcheck:
       test: enclave waitfor discover.enclave.io -t 2
       interval: 1m
       timeout: 3s
       retries: 2
       start_interval: 5s
       start_period: 1m
     environment:
       ENCLAVE_VIRTUAL_IP: ${ENCLAVE_VIRTUAL_IP}
       ENCLAVE_GATEWAY_DNS_SOURCE_FORWARDING: enabled
       ENCLAVE_GATEWAY_DNS_UPSTREAM_SERVERS: ${PIHOLE_PRIMARY_IP} # force enclave to only use this gateway to resolve names
       ENCLAVE_GATEWAY_DNS_UPSTREAM_TIMEOUT_MS: 200
       ENCLAVE_SOURCE_MATCH_POLICY: any
       ENCLAVE_LOCAL_PORT: ${ENCLAVE_LOCAL_PORT}
       ENCLAVE_STUB_RESOLVER: disabled
       ENCLAVE_ENROLMENT_KEY: ${ENCLAVE_ENROLMENT_KEY}
       # ENCLAVE_LOG_LEVEL: Debug

  pihole:
      image: pihole/pihole:latest
      volumes:
      - ./etc/pihole:/etc/pihole
      - etc-dnsmasq:/etc/dnsmasq.d
      hostname: ${PIHOLE_HOSTNAME}
      mem_limit: 150M
      cap_add:
       - CAP_SYS_TIME
      restart: unless-stopped
      ports:
      - "${ENCLAVE_LOCAL_PORT}:${ENCLAVE_LOCAL_PORT}/tcp"
      - "${ENCLAVE_LOCAL_PORT}:${ENCLAVE_LOCAL_PORT}/udp"
      cpu_count: 1
      extra_hosts:
      - "primary.dns.internal:${PIHOLE_PRIMARY_IP}"
      - "secondary.dns.internal:${PIHOLE_SECONDARY_IP}"
      networks:
       gw-net:
      environment:
        TZ: 'Europe/London'
        FTLCONF_webserver_api_password: ''
        FTLCONF_webserver_port: 1080
        # Traffic to the pi-hole admin interface is proxied through Caddy to apply HTTPS and handle redirects,
        # so we restrict the pi-hole admin interface to only be available via the Caddy proxy.
        FTLCONF_dns_interface: '127.0.0.1'
        FTLCONF_dns_domain: 'dnsfilter.enclave'
        FTLCONF_dns_piholePTR: NONE
        FTLCONF_dns_listeningMode: all
        FTLCONF_dns_blocking_mode: IP_NODATA_AAAA
        FTLCONF_dns_reply_host_IPv4: ${ENCLAVE_VIRTUAL_IP}
        FTLCONF_dns_reply_blocking_IPv4: ${ENCLAVE_VIRTUAL_IP}
        FTLCONF_database_maxDBdays: 30

  pihole-enclave-sync:
      image: enclavenetworks/pihole-enclave-sync:latest
      volumes:
      - ./etc/pihole:/etc/pihole
      - enclave-config:/etc/enclave
      depends_on:
        pihole:
          condition: service_healthy
      mem_limit: 50M
      cpu_count: 1
      restart: unless-stopped
      environment:
        PIHOLE_SYNC_DBPATH: /etc/pihole/gravity.db
        PIHOLE_SYNC_CUSTOMDNSLISTPATH: /etc/pihole/custom.list
        PIHOLE_SYNC_ENCLAVE_PROFILE: Universe
      network_mode: 'service:pihole'

  caddy:
    image: caddy:latest
    volumes:
      - caddy-data:/data
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./blockpage:/blockpage
      - ./certs:/certs
    restart: unless-stopped
    network_mode: 'service:pihole'
    depends_on:
      enclave:
        condition: service_started
    mem_limit: 50M
    cpu_count: 1
    environment:
      PIHOLE_PROXY_BIND_ADDR: ${ENCLAVE_VIRTUAL_IP}
      PIHOLE_LB_UPSTREAM_LIST: http://primary.dns.internal:1080 http://secondary.dns.internal:1080

  # Only on primary
  nebula-sync:
    image: ghcr.io/lovelaze/nebula-sync:latest
    network_mode: 'service:pihole'
    mem_limit: 50M
    depends_on:
      pihole:
        condition: service_healthy
      caddy:
        condition: service_started
    cpu_count: 1
    environment:
    - PRIMARY=http://primary.dns.internal:1080|
    - REPLICAS=http://secondary.dns.internal:1080|
    - FULL_SYNC=false
    - RUN_GRAVITY=true
    - CLIENT_SKIP_TLS_VERIFICATION=true
    - CRON=* * * * * # Every hour: 0 * * * *
    - SYNC_CONFIG_DNS=false # Config items set by ENV var cannot be changed, produces a 400 from the far-side API if not set
    - SYNC_CONFIG_DATABASE=false

volumes:
  enclave-config:
  enclave-logs:
  etc-dnsmasq:
  caddy-data: